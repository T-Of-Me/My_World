<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Portfolio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>Welcome to Portfolio Maker</header>
<div class="container">
    <h2>Create Portfolio</h2>

    <form th:action="@{/dashboard/save}" method="post">
        <textarea name="content" rows="10" maxlength="2000" placeholder="Write your portfolio here..."></textarea>
        <button type="submit">Save as Markdown</button>
    </form>

    <div th:if="${message}" class="message" th:text="${message}"></div>

    <div class="footer">
        <div th:if="${filename}">
            <a th:href="@{'/download/' + ${filename}}">Download last saved</a>
        </div>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>
</body>
</html>
