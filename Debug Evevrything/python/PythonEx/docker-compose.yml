services:
  web:
    build: .
    working_dir: /app
    volumes:
      - ./src:/app
    command: flask run --host=0.0.0.0 --port=8000
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1        # auto-reload khi sửa file trong ./src
    ports:
      - "8080:8000"          # mở http://localhost:8080
    restart: unless-stopped
